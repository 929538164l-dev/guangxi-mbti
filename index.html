<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="桂MBTI｜广西人格测试，纯前端单文件网页，无需联网即可打开使用。" />
<meta name="theme-color" content="#C84B2E" />
<title>桂MBTI — 广西人格测试</title>
<style>
:root {
  --red: #C84B2E;
  --red-light: #F5E8E3;
  --red-mid: #E07050;
  --green: #3A6B3E;
  --green-light: #EAF0E8;
  --gold: #B8860B;
  --gold-light: #FDF5DC;
  --ink: #1A1208;
  --ink2: #3D2E1A;
  --muted: #8A7A68;
  --bg: #FBF7F0;
  --bg2: #F3EDE2;
  --card: #FFFFFF;
  --border: rgba(90,60,30,0.12);
  --serif: "STSong", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC",
           "SimSun", "PMingLiU", Georgia, serif;
  --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
          "Source Han Sans SC", "WenQuanYi Micro Hei", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Decorative background pattern */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(200,75,46,0.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(58,107,62,0.06) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(184,134,11,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* Subtle grid texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Ccircle cx='30' cy='30' r='0.8' fill='%23c84b2e' opacity='0.06'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

.wrapper {
  max-width: 680px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
  position: relative;
  z-index: 1;
}

/* ── SPLASH ── */
#splash { text-align: center; padding: 3rem 0 2rem; animation: fadeUp 0.6s ease both; }

.splash-deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 1.5rem;
}
.deco-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--red), transparent); }
.deco-icon { font-size: 28px; }

.splash-badge {
  display: inline-block;
  background: var(--red-light);
  color: var(--red);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 2px;
  padding: 5px 16px;
  border-radius: 30px;
  margin-bottom: 1.5rem;
  border: 1px solid rgba(200,75,46,0.2);
}

#splash h1 {
  font-family: var(--serif);
  font-size: clamp(52px, 12vw, 80px);
  font-weight: 700;
  color: var(--red);
  letter-spacing: 8px;
  line-height: 1;
  margin-bottom: 0.5rem;
  text-shadow: 3px 3px 0 rgba(200,75,46,0.12);
}

.splash-sub {
  font-family: var(--serif);
  font-size: 16px;
  color: var(--muted);
  letter-spacing: 4px;
  margin-bottom: 2.5rem;
}

.splash-desc {
  font-size: 15px;
  line-height: 1.9;
  color: var(--ink2);
  max-width: 480px;
  margin: 0 auto 2.5rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.25rem 1.5rem;
}

.splash-stats {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-bottom: 2.5rem;
  flex-wrap: wrap;
}
.stat { text-align: center; }
.stat-num { font-family: var(--serif); font-size: 28px; font-weight: 700; color: var(--red); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

.start-btn {
  display: inline-block;
  background: var(--red);
  color: white;
  font-size: 16px;
  font-weight: 500;
  font-family: var(--sans);
  padding: 14px 48px;
  border-radius: 50px;
  border: none;
  cursor: pointer;
  letter-spacing: 2px;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 4px 20px rgba(200,75,46,0.3);
}
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(200,75,46,0.38); }
.start-btn:active { transform: scale(0.97); }

.splash-footer { margin-top: 2rem; font-size: 12px; color: var(--muted); }

/* ── QUIZ ── */
#quiz { display: none; animation: fadeUp 0.5s ease both; }

.progress-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.5rem;
}
.progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.progress-track { flex: 1; height: 6px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red-mid), var(--red));
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.progress-pct { font-size: 13px; font-weight: 500; color: var(--red); white-space: nowrap; min-width: 40px; text-align: right; }

.dim-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  background: var(--bg2);
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.dim-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }

.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  margin-bottom: 1rem;
  box-shadow: 0 2px 16px rgba(90,60,30,0.06);
}

.q-scene {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 1.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.q-emoji-bg {
  width: 54px;
  height: 54px;
  background: var(--red-light);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
}
.q-meta { flex: 1; }
.q-num-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 2px; }
.q-location { font-size: 13px; color: var(--red); font-weight: 500; }

.q-text {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.7;
  color: var(--ink);
  margin-bottom: 1.5rem;
}

.options { display: flex; flex-direction: column; gap: 10px; }

.opt {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  cursor: pointer;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.6;
  text-align: left;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.opt::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  background: var(--red-light);
  transition: width 0.25s;
}
.opt:hover { border-color: var(--red-mid); color: var(--ink); }
.opt:hover::before { width: 4px; }
.opt.selected { border-color: var(--red); background: var(--red-light); color: var(--ink); }
.opt.selected::before { width: 4px; background: var(--red); }
.opt-inner { position: relative; z-index: 1; }
.opt-ab {
  display: inline-block;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--red-light);
  color: var(--red);
  font-size: 11px;
  font-weight: 700;
  line-height: 20px;
  text-align: center;
  margin-right: 8px;
  flex-shrink: 0;
  vertical-align: middle;
}
.opt.selected .opt-ab { background: var(--red); color: white; }

.nav {
  display: flex;
  gap: 10px;
  margin-top: 1.25rem;
}
.btn-back {
  padding: 12px 20px;
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 50px;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--sans);
  transition: all 0.15s;
}
.btn-back:hover { border-color: var(--muted); color: var(--ink); }

.btn-next,
.btn-secondary,
.btn-share {
  padding: 13px;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--sans);
  letter-spacing: 1px;
  transition: all 0.2s;
}

.btn-next {
  flex: 1;
  background: var(--red);
  color: white;
  box-shadow: 0 4px 16px rgba(200,75,46,0.28);
}
.btn-next:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(200,75,46,0.38); }
.btn-next:active:not(:disabled) { transform: scale(0.98); }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

.btn-secondary {
  width: 100%;
  background: transparent;
  border: 1.5px solid var(--red);
  color: var(--red);
}
.btn-secondary:hover { background: var(--red-light); }

.btn-share {
  width: 100%;
  background: var(--red);
  color: #fff;
  box-shadow: 0 4px 16px rgba(200,75,46,0.28);
}
.btn-share:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(200,75,46,0.38); }

/* ── RESULT ── */
#result { display: none; animation: fadeUp 0.6s ease both; }

.result-hero {
  text-align: center;
  padding: 2.5rem 1.5rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  margin-bottom: 1rem;
  box-shadow: 0 4px 30px rgba(90,60,30,0.08);
  position: relative;
  overflow: hidden;
}
.result-hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
}
.result-emoji-big {
  font-size: 64px;
  display: block;
  margin-bottom: 0.75rem;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
}
.result-type-code {
  font-family: var(--serif);
  font-size: 56px;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 4px;
  line-height: 1;
  margin-bottom: 0.5rem;
  text-shadow: 2px 2px 0 rgba(200,75,46,0.1);
}
.result-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 4px;
}
.result-eng { font-size: 13px; color: var(--muted); letter-spacing: 2px; margin-bottom: 1.25rem; }

.result-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: center;
  margin-bottom: 1.5rem;
}
.rtag {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(200,75,46,0.25);
  color: var(--red);
  background: var(--red-light);
  font-weight: 500;
}

.result-desc {
  font-size: 14px;
  line-height: 1.9;
  color: var(--ink2);
  text-align: left;
  background: var(--bg);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.25rem;
}

.result-famous {
  font-size: 13px;
  color: var(--muted);
  background: var(--gold-light);
  border-left: 3px solid var(--gold);
  padding: 8px 14px;
  border-radius: 0 8px 8px 0;
  text-align: left;
}

/* Dim bars */
.dims-section,
.compat-section,
.history-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  box-shadow: 0 2px 12px rgba(90,60,30,0.05);
}
.dims-title,
.compat-title,
.history-title {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 1.25rem;
  letter-spacing: 2px;
}
.dim-row { margin-bottom: 1.2rem; }
.dim-row:last-child { margin-bottom: 0; }
.dim-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; gap: 10px; }
.dim-winner { color: var(--red); font-weight: 600; }
.dim-track { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; position: relative; }
.dim-fill { height: 100%; background: linear-gradient(90deg, var(--red-mid), var(--red)); border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

.compat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compat-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}
.compat-label { font-size: 11px; margin-bottom: 4px; }
.compat-val { font-size: 13px; font-weight: 500; color: var(--ink); }
.compat-type { font-size: 12px; color: var(--muted); margin-top: 2px; }
.compat-card.best { border-color: rgba(58,107,62,0.3); background: var(--green-light); }
.compat-card.best .compat-label { color: var(--green); }
.compat-card.clash { border-color: rgba(200,75,46,0.2); background: var(--red-light); }
.compat-card.clash .compat-label { color: var(--red); }
.compat-card.work { border-color: rgba(184,134,11,0.25); background: var(--gold-light); }
.compat-card.work .compat-label { color: var(--gold); }

.result-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 1rem;
}

.notice {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  min-height: 18px;
}

.history-content {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.8;
}
.history-empty {
  color: var(--muted);
}

.share-card {
  position: fixed;
  left: -99999px;
  top: 0;
  width: 720px;
  background: linear-gradient(180deg, #fff9f5 0%, #fff 100%);
  color: var(--ink);
  border: 1px solid rgba(200,75,46,0.15);
  padding: 36px;
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
}
.share-card .share-head {
  text-align: center;
  margin-bottom: 20px;
}
.share-card .share-title {
  font-family: var(--serif);
  font-size: 48px;
  color: var(--red);
  letter-spacing: 4px;
  line-height: 1;
}
.share-card .share-sub {
  font-size: 18px;
  color: var(--muted);
  margin-top: 8px;
}
.share-card .share-body {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 26px;
}
.share-card .share-emoji {
  font-size: 52px;
  text-align: center;
  margin-bottom: 10px;
}
.share-card .share-code {
  font-family: var(--serif);
  text-align: center;
  font-size: 42px;
  color: var(--red);
  letter-spacing: 4px;
  margin-bottom: 8px;
}
.share-card .share-name {
  text-align: center;
  font-family: var(--serif);
  font-size: 26px;
  margin-bottom: 14px;
}
.share-card .share-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 18px;
}
.share-card .share-tag {
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--red-light);
  color: var(--red);
  font-size: 13px;
  border: 1px solid rgba(200,75,46,0.2);
}
.share-card .share-desc {
  font-size: 16px;
  line-height: 1.9;
  color: var(--ink2);
  background: var(--bg);
  border-radius: 12px;
  padding: 16px;
}
.share-card .share-footer {
  margin-top: 18px;
  text-align: center;
  font-size: 15px;
  color: var(--muted);
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 3rem 0 1rem;
  font-size: 12px;
  color: var(--muted);
}
.footer-deco { margin-bottom: 0.75rem; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in { animation: fadeUp 0.4s ease both; }

/* Responsive */
@media (max-width: 480px) {
  .wrapper { padding: 1.5rem 1rem 3rem; }
  #splash h1 { font-size: 52px; }
  .q-card { padding: 1.5rem; }
  .result-hero { padding: 2rem 1.25rem; }
  .compat-grid { grid-template-columns: 1fr 1fr; }
  .result-type-code { font-size: 44px; }
}

@media (max-width: 380px) {
  .compat-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrapper">

  <!-- ═══ SPLASH ═══ -->
  <div id="splash">
    <div class="splash-deco">
      <div class="deco-line"></div>
      <div class="deco-icon">🌶</div>
      <div class="deco-line"></div>
    </div>
    <div class="splash-badge">广 西 人 格 测 试</div>
    <h1>桂 MBTI</h1>
    <div class="splash-sub">你是哪款老表？</div>

    <div class="splash-desc">
      基于 MBTI 框架，结合广西的螺蛳粉、山歌、壮锦、边境、漓江……<br>
      16 种原创广西人格，总有一款是你。<br>
      <span style="color:var(--muted);font-size:13px">不管你是南宁老表还是桂北人，都能找到共鸣。</span>
    </div>

    <div class="splash-stats">
      <div class="stat"><div class="stat-num">15</div><div class="stat-label">道情景题</div></div>
      <div class="stat"><div class="stat-num">16</div><div class="stat-label">广西人格</div></div>
      <div class="stat"><div class="stat-num">~5</div><div class="stat-label">分钟完成</div></div>
    </div>

    <button class="start-btn" onclick="startQuiz()">开始测试</button>
    <div class="splash-footer">测试结果仅供娱乐，老表莫太认真 😄</div>
  </div>

  <!-- ═══ QUIZ ═══ -->
  <div id="quiz">
    <div class="progress-header">
      <div class="progress-label" id="q-label">第 1 题</div>
      <div class="progress-track"><div class="progress-fill" id="p-fill" style="width:0%"></div></div>
      <div class="progress-pct" id="p-pct">0%</div>
    </div>

    <div class="q-card" id="q-card">
      <!-- injected by JS -->
    </div>

    <div class="nav">
      <button class="btn-back" id="btn-back" onclick="prev()">← 上一题</button>
      <button class="btn-next" id="btn-next" onclick="next()" disabled>下一题 →</button>
    </div>
  </div>

  <!-- ═══ RESULT ═══ -->
  <div id="result">
    <div class="result-hero" id="result-hero"></div>
    <div class="dims-section" id="dims-section"></div>
    <div class="compat-section" id="compat-section"></div>
    <div class="history-section" id="history-section"></div>

    <div class="result-actions">
      <button class="btn-share" onclick="exportShareImage()">🖼 导出结果图片</button>
      <button class="btn-secondary" onclick="copyResultText()">📋 复制结果文案</button>
      <button class="btn-secondary" onclick="restart()">🔄 重新测试</button>
      <div class="notice" id="notice"></div>
    </div>
  </div>

  <div class="site-footer">
    <div class="footer-deco">🌿 ✦ 🌶</div>
    桂 MBTI · 广西人格测试 · 仅供娱乐
  </div>
</div>

<!-- hidden share card -->
<div id="share-card" class="share-card" aria-hidden="true"></div>

<script>
// ════════════════════════════════════
// DATA: 15 QUESTIONS
// ════════════════════════════════════
const questions = [
  {
    id:1, dim:"E_I", emoji:"🍜", location:"南宁 · 老友粉街",
    text:"周末朋友约你去嗦粉，你的第一反应是？",
    opts:[
      {ab:"A", text:"爽！再叫几个老表，人多才热闹，粉也更香！", val:"E"},
      {ab:"B", text:"一个人嗦更安逸，点好粉坐角落慢慢嗦。", val:"I"}
    ]
  },
  {
    id:2, dim:"E_I", emoji:"🎉", location:"桂林 · 旅游旺季",
    text:"桂林景区人挤人，排队两小时才能看一眼漓江，你觉得——",
    opts:[
      {ab:"A", text:"热闹才有气氛！我已经跟旁边的广东老表聊上了。", val:"E"},
      {ab:"B", text:"我宁愿淡季来，一个人对着漓江发呆才是享受。", val:"I"}

// ════════════════════════════════════
let cur = 0;
let answers = {};
let selVal = null;
let lastResultCode = null;

const STORAGE_KEY = "guangxi_mbti_last_result_v1";

// ════════════════════════════════════
// LOGIC
// ════════════════════════════════════
function calcType(ans) {
  const s = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  questions.forEach(q => { if(ans[q.id]) s[ans[q.id]]++; });
  return (s.E>=s.I?'E':'I')+(s.S>=s.N?'S':'N')+(s.T>=s.F?'T':'F')+(s.J>=s.P?'J':'P');
}

function getDim(ans, a, b) {
  let ac=0, bc=0;
  questions.forEach(q => {
    if(!ans[q.id]) return;
    if(ans[q.id]===a) ac++;
    else if(ans[q.id]===b) bc++;
  });
  const total = ac + bc || 1;
  return { a:ac, b:bc, pctA: Math.round(ac/total*100), winner: ac>=bc ? a : b };
}

function saveLastResult(code) {
  const info = types[code];
  if (!info) return;
  const payload = {
    code,
    name: info.name,
    emoji: info.emoji,
    time: new Date().toLocaleString("zh-CN")
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
}

function readLastResult() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function showNotice(text) {
  const el = document.getElementById("notice");
  el.textContent = text;
  clearTimeout(showNotice._t);
  showNotice._t = setTimeout(() => {
    el.textContent = "";
  }, 2200);
}

// ════════════════════════════════════
// RENDER
// ════════════════════════════════════
function startQuiz() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQ();
}

function renderQ() {
  const q = questions[cur];
  selVal = answers[q.id] || null;
  const pct = Math.round((cur / questions.length) * 100);

  document.getElementById('q-label').textContent = `第 ${cur+1} 题，共 ${questions.length} 题`;
  document.getElementById('p-fill').style.width = pct + '%';
  document.getElementById('p-pct').textContent = pct + '%';
  document.getElementById('btn-back').style.display = cur === 0 ? 'none' : '';
  document.getElementById('btn-next').disabled = !selVal;
  document.getElementById('btn-next').textContent = cur === questions.length - 1 ? '查看结果 ✦' : '下一题 →';

  const dimMap = {E_I:'外向 / 内向', S_N:'感知 / 直觉', T_F:'思维 / 情感', J_P:'判断 / 知觉'};

  document.getElementById('q-card').innerHTML = `
    <div class="dim-badge">
      <div class="dim-dot"></div>
      ${dimMap[q.dim] || q.dim}
    </div>
    <div class="q-scene">
      <div class="q-emoji-bg">${q.emoji}</div>
      <div class="q-meta">
        <div class="q-num-label">情景 ${cur+1} / ${questions.length}</div>
        <div class="q-location">📍 ${q.location}</div>
      </div>
    </div>
    <div class="q-text">${q.text}</div>
    <div class="options">
      ${q.opts.map(o => `
        <button class="opt${selVal===o.val ? ' selected' : ''}" onclick="choose('${o.val}', this)">
          <div class="opt-inner">
            <span class="opt-ab">${o.ab}</span>${o.text}
          </div>
        </button>
      `).join('')}
    </div>
  `;
}

function choose(val, el) {
  selVal = val;
  answers[questions[cur].id] = val;
  document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').disabled = false;
}

function next() {
  if (!selVal) return;
  cur++;
  if (cur >= questions.length) {
    showResult();
    return;
  }
  selVal = answers[questions[cur].id] || null;
  renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}

function prev() {
  if (cur > 0) {
    cur--;
    selVal = answers[questions[cur].id] || null;
    renderQ();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function renderHistory() {
  const data = readLastResult();
  const wrap = document.getElementById("history-section");
  if (!data) {
    wrap.innerHTML = `
      <div class="history-title">最近一次结果</div>
      <div class="history-content history-empty">你还没有保存过本地结果。</div>
    `;
    return;
  }

  wrap.innerHTML = `
    <div class="history-title">最近一次结果</div>
    <div class="history-content">
      <div>上次测出来的是：<strong>${data.emoji} ${data.code} · ${data.name}</strong></div>
      <div style="color:var(--muted);font-size:13px;margin-top:6px;">保存时间：${data.time}</div>
    </div>
  `;
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('splash').style.display = 'none';
  document.getElementById('result').style.display = 'block';

  const code = calcType(answers);
  lastResultCode = code;
  const info = types[code] || types['INFP'];
  saveLastResult(code);

  document.getElementById('result-hero').innerHTML = `
    <span class="result-emoji-big">${info.emoji}</span>
    <div class="result-type-code">${code}</div>
    <div class="result-name">${info.name}</div>
    <div class="result-eng">${info.eng}</div>
    <div class="result-tags">${info.tags.map(t => `<span class="rtag">${t}</span>`).join('')}</div>
    <div class="result-desc">${info.desc}</div>
    <div class="result-famous">${info.famous}</div>
  `;

  const dims = [
    {a:'E', b:'I', la:'外向 E', lb:'内向 I'},
    {a:'S', b:'N', la:'感知 S', lb:'直觉 N'},
    {a:'T', b:'F', la:'思维 T', lb:'情感 F'},
    {a:'J', b:'P', la:'判断 J', lb:'知觉 P'}
  ];

  document.getElementById('dims-section').innerHTML = `
    <div class="dims-title">人格维度分析</div>
    ${dims.map(d => {
      const sc = getDim(answers, d.a, d.b);
      const pct = sc.winner === d.a ? sc.pctA : 100 - sc.pctA;
      const winLabel = sc.winner === d.a ? d.la : d.lb;
      const loseLabel = sc.winner === d.a ? d.lb : d.la;
      return `
        <div class="dim-row">
          <div class="dim-labels">
            <span class="dim-winner">${winLabel} ${pct}%</span>
            <span>${loseLabel} ${100-pct}%</span>
          </div>
          <div class="dim-track"><div class="dim-fill" style="width:0%" data-w="${pct}%"></div></div>
        </div>
      `;
    }).join('')}
  `;

  setTimeout(() => {
    document.querySelectorAll('.dim-fill').forEach(el => {
      el.style.width = el.dataset.w;
    });
  }, 100);

  document.getElementById('compat-section').innerHTML = `
    <div class="compat-title">老表配对指南</div>
    <div class="compat-grid">
      <div class="compat-card best">
        <div class="compat-label">💚 最佳拍档</div>
        <div class="compat-val">${info.best.type}</div>
        <div class="compat-type">${info.best.name}</div>
      </div>
      <div class="compat-card work">
        <div class="compat-label">🤝 工作搭档</div>
        <div class="compat-val">${info.work.type}</div>
        <div class="compat-type">${info.work.name}</div>
      </div>
      <div class="compat-card clash" style="grid-column:1/-1">
        <div class="compat-label">🌶 最易摩擦</div>
        <div class="compat-val">${info.clash.type} · ${info.clash.name}</div>
        <div class="compat-type" style="font-size:12px;color:var(--muted);margin-top:4px">不是坏事，碰撞才有火花嘛</div>
      </div>
    </div>
  `;

  renderHistory();
  window.scrollTo({top:0, behavior:'smooth'});
}

function restart() {
  cur = 0;
  answers = {};
  selVal = null;
  lastResultCode = null;
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ════════════════════════════════════
// COPY RESULT
// ════════════════════════════════════
function getResultText() {
  const code = lastResultCode || calcType(answers);
  const info = types[code] || types["INFP"];
  return [
    `我测出来的广西人格是：${code} · ${info.name} ${info.emoji}`,
    `英文名：${info.eng}`,
    `人格标签：${info.tags.join(" / ")}`,
    `简介：${info.desc}`,
    `代表场景：${info.famous.replace(/^代表场景：/, "")}`,
    `—— 来自 桂MBTI｜广西人格测试`
  ].join("\n");
}

async function copyResultText() {
  const text = getResultText();
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    showNotice("结果文案已复制");
  } catch (e) {
    showNotice("复制失败，请手动复制");
  }
}

// ════════════════════════════════════
// SHARE IMAGE EXPORT (NO EXTERNAL LIB)
// uses SVG foreignObject -> Blob -> Canvas -> PNG
// ════════════════════════════════════
function escapeXml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildShareCardHTML(info, code) {
  return `
    <div xmlns="http://www.w3.org/1999/xhtml" style="
      width:720px;
      background:linear-gradient(180deg,#fff9f5 0%,#ffffff 100%);
      color:#1A1208;
      border:1px solid rgba(200,75,46,0.15);
      padding:36px;
      border-radius:24px;
      font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;
      box-sizing:border-box;
    ">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-family:Georgia,'Songti SC','STSong',serif;font-size:48px;color:#C84B2E;letter-spacing:4px;line-height:1;">桂 MBTI</div>
        <div style="font-size:18px;color:#8A7A68;margin-top:8px;">广西人格测试结果</div>
      </div>
      <div style="background:#fff;border:1px solid rgba(90,60,30,0.12);border-radius:18px;padding:26px;">
        <div style="font-size:52px;text-align:center;margin-bottom:10px;">${escapeXml(info.emoji)}</div>
        <div style="font-family:Georgia,'Songti SC','STSong',serif;text-align:center;font-size:42px;color:#C84B2E;letter-spacing:4px;margin-bottom:8px;">${escapeXml(code)}</div>
        <div style="text-align:center;font-family:Georgia,'Songti SC','STSong',serif;font-size:26px;margin-bottom:14px;">${escapeXml(info.name)}</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;">
          ${info.tags.map(tag => `
            <span style="padding:4px 10px;border-radius:20px;background:#F5E8E3;color:#C84B2E;font-size:13px;border:1px solid rgba(200,75,46,0.2);">${escapeXml(tag)}</span>
          `).join("")}
        </div>
        <div style="font-size:16px;line-height:1.9;color:#3D2E1A;background:#FBF7F0;border-radius:12px;padding:16px;">
          ${escapeXml(info.desc)}
        </div>
      </div>
      <div style="margin-top:18px;text-align:center;font-size:15px;color:#8A7A68;">
        我是哪款老表？快来测你的广西人格
      </div>
    </div>
  `;
}

async function exportShareImage() {
  try {
    const code = lastResultCode || calcType(answers);
    const info = types[code] || types["INFP"];
    const cardHTML = buildShareCardHTML(info, code);

    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="720" height="980">
        <foreignObject width="100%" height="100%">
          ${cardHTML}
        </foreignObject>
      </svg>
    `;

    const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(blob);

    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 980;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      URL.revokeObjectURL(url);

      canvas.toBlob(function(pngBlob) {
        if (!pngBlob) {
          showNotice("导出失败");
          return;
        }
        const a = document.createElement("a");
        const pngUrl = URL.createObjectURL(pngBlob);
        a.href = pngUrl;
        a.download = `桂MBTI-${code}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
        showNotice("结果图片已导出");
      }, "image/png");
    };

    img.onerror = function() {
      URL.revokeObjectURL(url);
      showNotice("导出失败，当前浏览器不支持此方式");
    };

    img.src = url;
  } catch (e) {
    showNotice("导出失败");
  }
}

// ════════════════════════════════════
// INIT
// ════════════════════════════════════
(function init() {
  renderHistoryPreviewOnSplash();
})();

function renderHistoryPreviewOnSplash() {
  const data = readLastResult();
  if (!data) return;

  const footer = document.querySelector(".splash-footer");
  footer.innerHTML = `
    上次结果：<strong>${data.emoji} ${data.code} · ${data.name}</strong><br>
    <span style="font-size:11px;">测试结果仅供娱乐，老表莫太认真 😄</span>
  `;
}
</script>
